name: Flutter CI

on:
  push:
    branches:
      - main
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-ci.yml"


permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate formatter snapshots (temporary audit step)
        if: always()
        run: |
          mkdir -p /tmp/dart-format-snapshot
          dart format --output=show lib/providers/price_compare_provider.dart > /tmp/dart-format-snapshot/price_compare_provider.dart
          dart format --output=show lib/ui/input_screen.dart > /tmp/dart-format-snapshot/input_screen.dart
          dart format --output=show test/engine/decimal_test.dart > /tmp/dart-format-snapshot/decimal_test.dart
          dart format --output=show test/engine/purchase_context_test.dart > /tmp/dart-format-snapshot/purchase_context_test.dart
          dart format --output=show test/engine/quantity_test.dart > /tmp/dart-format-snapshot/quantity_test.dart
          dart format --output=show test/engine/unit_normalizer_test.dart > /tmp/dart-format-snapshot/unit_normalizer_test.dart

      - name: Upload formatter snapshots (temporary audit step)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-format-snapshot
          path: /tmp/dart-format-snapshot/

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
